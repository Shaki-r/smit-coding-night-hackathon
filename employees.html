<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employees · HCM Lite</title><link rel="stylesheet" href="css/style.css"><script defer src="js/storage.js"></script><script defer src="js/auth.js"></script><script defer src="js/employees.js"></script><script defer src="js/attendance.js"></script><script defer src="js/leave.js"></script><script defer src="js/helper.js"></script><script defer src="js/app.js"></script></head><body data-page="employees" data-role="admin"><div class="app-shell"><aside class="sidebar" id="sidebar"></aside><main class="main-area"><header class="topbar" id="topbar"></header><section class="page-content"><div class="page-heading"><div><p class="eyebrow">YOUR PEOPLE</p><h1>Employees</h1><p class="page-subtitle">Manage your team and their account details.</p></div><div class="heading-actions"><span class="count-chip" id="employee-count">0 employees</span></div></div><div class="content-grid employees-layout"><section class="panel"><div class="panel-heading"><div><h2>Add an employee</h2><p>New accounts start with the details you enter.</p></div><span class="panel-icon">＋</span></div><form id="employee-form" class="stack-form compact-form"><div class="form-two"><label>Full name<input name="name" required maxlength="80" placeholder="Enter full name"></label><label>Email address<input name="email" type="email" required placeholder="name@company.com"></label></div><div class="form-two"><label>Phone number<input name="phone" type="tel" placeholder="Enter phone number"></label><label>Department<input name="department" required placeholder="e.g. Operations"></label></div><div class="form-two"><label>Designation<input name="designation" required placeholder="e.g. Coordinator"></label><label>Monthly salary<input name="salary" type="number" min="1" step="0.01" required placeholder="Enter salary"></label></div><label>Temporary password<input name="password" type="password" minlength="6" required placeholder="At least 6 characters"></label><button class="btn btn-primary btn-full" type="submit">Create employee account <span>→</span></button><p id="employee-message" class="form-message" role="status"></p></form></section><section class="panel"><div class="panel-heading"><div><h2>Team directory</h2><p>Search your registered employees.</p></div></div><div class="search-row"><span>⌕</span><input id="employee-search" placeholder="Search name, email or department…" aria-label="Search employees"></div><div id="employee-table" class="table-wrap"></div></section></div><footer class="page-footer">HCM Lite <span>People operations, made simpler.</span></footer></section></main></div></body></html>
